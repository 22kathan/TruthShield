name: Build & Release TruthShield Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx @capacitor/cli sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Generate Production Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/truthshield.keystore \
            -alias truthshield -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass truthshield123 -keypass truthshield123 \
            -dname "CN=TruthShield Forensics, OU=Security, O=TruthShield, L=Ahmedabad, ST=Gujarat, C=IN"

      - name: Build Android Signed Production Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Stage APK & ZIP for Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/TruthShield.apk
          
          # Create companion ZIP mirror package (for mobile browsers that block raw .apk)
          cd release-output
          zip -9 TruthShield-Android.zip TruthShield.apk
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TruthShield-Mobile-Package
          path: release-output/
          retention-days: 90

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          commit_message: "Deploy TruthShield Web App & PWA to gh-pages [skip ci]"

      - name: Publish GitHub Release v1.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "TruthShield Mobile Application v1.3.1"
          draft: false
          prerelease: false
          body: |
            ## 🛡️ TruthShield Mobile Application — Version 1.3.1

            Latest stable Android Application (.APK) and Progressive Web App for TruthShield AI Media Forensics & Threat Intelligence Suite.

            ### 📥 Download Options:
            * **[Download TruthShield.apk (Direct APK)](https://github.com/22kathan/TruthShield/releases/download/v1.3.1/TruthShield.apk)** *(Tap to install on any Android device)*
            * **[Download TruthShield-Android.zip (Mirror)](https://github.com/22kathan/TruthShield/releases/download/v1.3.1/TruthShield-Android.zip)** *(ZIP package for phone browsers that block direct .apk downloads)*
            * **[Online Download Portal](https://22kathan.github.io/TruthShield/download.html)** *(Mobile-optimized installation center)*

            ### 📱 What's New & Fixed in v1.3.1:
            - **1st-Attempt Storage Loading Fix**: Fixed error where images and videos loaded from phone storage failed on the 1st attempt and only succeeded on the 2nd attempt.
            - **Multi-Stage Resilient Media Decoding**: Added automatic in-memory buffering and FileReader fallbacks to bypass Android Scoped Storage / ContentProvider stream delays.
            - **Mobile Inline Video Decoders**: Configured `playsinline`, `preload="auto"`, and multi-event metadata listeners to eliminate mobile video decoding race conditions.
            - **Zero-Failure Frame Extraction**: Added dimensional fallback guards and frame rendering error recovery.
            - **Input Reset Reliability**: Automatically cleared input file states on selection to ensure repeat and alternate file picks trigger smoothly.
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
