name: Build & Release TruthShield Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx @capacitor/cli sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Stage APK & ZIP for Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/TruthShield.apk
          
          # Create companion ZIP mirror package (for mobile browsers that block raw .apk)
          cd release-output
          zip -9 TruthShield-Android.zip TruthShield.apk
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TruthShield-Mobile-Package
          path: release-output/
          retention-days: 90

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          commit_message: "Deploy TruthShield Web App & PWA to gh-pages [skip ci]"

      - name: Publish GitHub Release v1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "TruthShield Mobile Application v1.3.0"
          draft: false
          prerelease: false
          body: |
            ## 🛡️ TruthShield Mobile Application — Version 1.3.0

            Latest stable Android Application (.APK) and Progressive Web App for TruthShield AI Media Forensics & Threat Intelligence Suite.

            ### 📥 Download Options:
            * **[Download TruthShield.apk (Direct APK)](https://github.com/22kathan/TruthShield/releases/download/v1.3.0/TruthShield.apk)** *(Tap to install on any Android device)*
            * **[Download TruthShield-Android.zip (Mirror)](https://github.com/22kathan/TruthShield/releases/download/v1.3.0/TruthShield-Android.zip)** *(ZIP package for phone browsers that block direct .apk downloads)*
            * **[Online Download Portal](https://22kathan.github.io/TruthShield/download.html)** *(Mobile-optimized installation center)*

            ### 📱 What's New & Fixed in v1.3.0:
            - **Phone Browser Download Fix**: Added direct and ZIP download mirrors to eliminate "download failed" browser errors.
            - **Mobile Permissions**: Added `CAMERA`, `RECORD_AUDIO`, and `VIBRATE` permissions for hardware-accelerated analysis.
            - **Native Share Target**: Supports receiving shared media straight from WhatsApp, Telegram, or Gallery.
            - **Bottom Navigation**: Ergonomic 1-tap switching between Home, Text, Scanner, Image, and Video.
            - **Dedicated Mobile Download Portal**: Accessible via `download.html`.
          files: release-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
