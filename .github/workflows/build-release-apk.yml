name: Build & Release TruthShield Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx @capacitor/cli sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Stage APK for Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/TruthShield.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruthShield-Android-APK
          path: release-output/TruthShield.apk
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "TruthShield Mobile Application v1.2.0"
          draft: false
          prerelease: false
          body: |
            ## 🛡️ TruthShield Mobile Application — Official Release (v1.2.0)

            Direct Android Application (.APK) package for TruthShield AI Media Forensics & Threat Intelligence Suite.

            ### 📥 Download Android APK:
            * **[Download TruthShield.apk](https://github.com/22kathan/TruthShield/releases/download/v1.2.0/TruthShield.apk)** *(Tap to download and install on any Android phone)*

            ### ✨ Key Features in Mobile App:
            - **On-Device Forensic Scanner**: DCT frequency domain & ViT texture anomaly inspection.
            - **Live Viewfinder Reticle**: In-app camera for instant photo snap and 10s video clip verification.
            - **Ergonomic Bottom Navigation**: 1-tap switching between Home, Text, Camera Scan, Image, and Video.
            - **Haptic Feedback**: Distinct tactical vibrations on deepfake vs authentic verdicts.
            - **System Share Sheet Target**: Share content from WhatsApp/Twitter/Telegram directly into TruthShield.
            - **Offline-First Resilience**: Service worker caching and local WebGL/WASM acceleration.
          files: release-output/TruthShield.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
