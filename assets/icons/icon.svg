<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14264b"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="4"/>

  <!-- Outer forensic circuit rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00ffaa" stroke-width="1" stroke-dasharray="4 16" opacity="0.3"/>

  <!-- Main Shield -->
  <path d="M256,76 L410,126 C410,270 340,370 256,436 C172,370 102,270 102,126 Z" 
        fill="url(#shieldGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#neonGlow)"/>

  <!-- Inner Shield accent -->
  <path d="M256,108 L380,148 C380,262 322,342 256,396 C190,342 132,262 132,148 Z" 
        fill="#0f1f3d" stroke="url(#emeraldGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Digital Grid horizontal scanlines -->
  <line x1="150" y1="200" x2="362" y2="200" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>
  <line x1="170" y1="250" x2="342" y2="250" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="300" x2="312" y2="300" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>

  <!-- Central Verification Checkmark -->
  <path d="M190,256 L235,302 L325,198" 
        fill="none" stroke="url(#emeraldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Radar pulse center node -->
  <circle cx="256" cy="256" r="12" fill="#00e5ff" opacity="0.6"/>
  <circle cx="256" cy="256" r="4" fill="#ffffff"/>
</svg>
